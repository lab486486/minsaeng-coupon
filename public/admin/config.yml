backend:
  name: github
  repo: lab486486/minsaeng-coupon
  branch: main
  base_url: https://minsaeng-coupon.pages.dev
  auth_endpoint: api/auth
  cms_label_prefix: minsaeng

local_backend: false

media_library:
  name: r2

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# 미리보기 기본 숨김 + 본문 하단 「미리보기|발행」 (cms-preview-default.js)

x-blog-fields: &blog_fields
  - { label: 제목, name: title, widget: string }
  - label: 날짜
    name: publishedAt
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    default: "{{now}}"
  - { label: 디스크립션, name: description, widget: text }
  - { label: 커버 이미지, name: cover_image, widget: image, required: false }
  - { label: 카테고리, name: tags, widget: list, default: ["민생회복지원금"], required: false }
  - label: 퍼머링크 (슬러그)
    name: slug
    widget: string
    required: true
    hint: "글 URL입니다. 예: apply-guide → /posts/apply-guide/"
  - label: 본문
    name: body
    widget: tui-markdown
    height: 420px
    initial_edit_type: wysiwyg
    preview_style: tab
  - { label: 글 유형, name: category, widget: select, options: [총정리, 신청방법, 지역, 소득기준, FAQ, 기타], default: 총정리 }
  - label: 수정일
    name: updatedAt
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    default: "{{now}}"
  - { label: 핵심 노출, name: featured, widget: boolean, default: false }
  - { label: 초안, name: draft, widget: boolean, default: false }

collections:
  - name: site
    label: 사이트 설정
    files:
      - name: general
        label: 사이트 상세 설정하기
        file: src/data/site.json
        format: json
        fields:
          - label: 사이트 제목
            name: title
            widget: string
            hint: "상단 로고·브라우저 탭 제목에 표시됩니다."
          - label: 사이트 주소
            name: site_url
            widget: string
            hint: "이 주소를 변경해도 사이트 설정에는 영향이 없습니다."
          - label: 카피라이트 이름
            name: copyright_name
            widget: string
            hint: "하단 © 옆에 표시되는 이름입니다."

      - name: google_search_console
        label: 구글 서치콘솔
        file: src/data/site/google-search-console.json
        format: json
        fields:
          - label: 소유권 확인 코드
            name: code
            widget: text
            required: false
            hint: "Search Console → HTML 태그 방식의 meta 태그 전체 또는 content 값"

      - name: naver_search_advisor
        label: 네이버 서치어드바이저
        file: src/data/site/naver-search-advisor.json
        format: json
        fields:
          - label: 소유권 확인 코드
            name: code
            widget: text
            required: false
            hint: "서치어드바이저 → HTML 태그의 meta content 값"

  - name: adsense
    label: 애드센스 설정
    files:
      - name: enabled
        label: 광고 활성화
        file: src/data/adsense/enabled.json
        format: json
        fields:
          - label: 애드센스 사용
            name: enabled
            widget: boolean
            default: true
            hint: "끄면 사이트에서 애드센스 로드를 멈춥니다(배포 반영 후)."

      - name: head_script
        label: 애드센스 코드 입력
        file: src/data/adsense/head-script.json
        format: json
        fields:
          - label: 기본 script 코드
            name: script
            widget: text
            required: false
            hint: "AdSense → 코드 가져오기 → 사이트 전체 태그 script를 붙여넣으세요."

      - name: ads_txt
        label: ads.txt 입력
        file: src/data/adsense/ads-txt.json
        format: json
        fields:
          - label: ads.txt 한 줄
            name: content
            widget: string
            required: false
            hint: "예) google.com, pub-XXXXXXXXXXXXXXXX, DIRECT, f08c47fec0942fa0"

  - name: posts
    label: 기존 글 목록
    label_singular: 글
    folder: src/content/posts
    create: false
    delete: true
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    fields: *blog_fields

  - name: posts_new
    label: 새 글쓰기
    label_singular: 글
    folder: src/content/posts
    create: true
    delete: false
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    fields: *blog_fields

  - name: regionalGrants
    label: 지역지원금 정보
    label_singular: 지역지원금 정보
    description: "뉴스 제목으로 자동 초안(draft)이 매일 생길 수 있습니다. 검토·수정 후 초안을 해제하면 /regional/ 에 노출됩니다."
    folder: src/content/regional-grants
    create: true
    delete: true
    identifier_field: title
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{region}} · {{amount}} · {{title}}"
    sortable_fields: ['verifiedAt', 'region', 'amount', 'title']
    view_filters:
      - { label: 게시 중, field: draft, pattern: false }
      - { label: 초안, field: draft, pattern: true }
    fields:
      - { label: 제목, name: title, widget: string, hint: 예) 속초시 민생지원금 1인 20만원 안내 }
      - { label: 지역, name: region, widget: string, hint: 예) 속초시 }
      - { label: 금액, name: amount, widget: string, hint: 예) 20만원 }
      - { label: 대상, name: target, widget: string, hint: 예) 전 시민 }
      - { label: 신청 기간, name: applyPeriod, widget: string, default: 공고 확인 }
      - { label: 출처 이름, name: sourceName, widget: string, default: 뉴스·지자체 공고 }
      - {
          label: 출처 URL,
          name: sourceUrl,
          widget: string,
          hint: 뉴스 또는 공식 공고 링크 (지원금 뉴스에서 복사),
        }
      - { label: 확인일, name: verifiedAt, widget: string, hint: YYYY-MM-DD }
      - {
          label: 초안,
          name: draft,
          widget: boolean,
          default: true,
          hint: 초안이면 /regional/ 에 안 나갑니다. 검토 후 체크 해제,
        }
      - label: 본문
        name: body
        widget: tui-markdown
        height: 420px
        initial_edit_type: wysiwyg
        preview_style: tab
        default: |
          ## 한줄 요약

          (뉴스에서 확인한 내용을 한두 문장으로)

          ## 지원 내용(보도·공고 기준)

          - 지역:
          - 금액:
          - 대상:

          ## 신청·확인

          1. 지자체 홈페이지·공고 확인
          2. 신청 기간·지급 수단 확인
          3. 사용처·기한 확인

          ## 참고

          실제 자격·금액·일정은 공식 공고를 우선합니다.
